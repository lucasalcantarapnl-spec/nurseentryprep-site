<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your TEAS 7 Practice Pack | Nurse Entry Prep</title>
<link rel="stylesheet" href="../style.css?v=3">
</head>
<body>
<header class="top"><div class="wrap row"><a class="brand" href="../index.html">Nurse Entry Prep</a><span class="fine">Member area</span></div></header>
<main class="quiz" id="quiz">
  <h1>Your TEAS 7 Practice Pack</h1>
  <p>Enter the access code from your purchase email.</p>
  <form id="f"><input class="fill" id="code" autocomplete="off" placeholder="NEP-..." style="width:100%;max-width:360px"> <button class="btn" type="submit">Open</button></form>
  <p class="fine" id="msg"></p>
  <p class="fine">Lost your code? Email <a href="mailto:support@nurseentryprep.com">support@nurseentryprep.com</a> with your order number.</p>
</main>
<script src="../quiz.js?v=3"></script>
<script>
(function () {
  const root = document.getElementById('quiz');
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function open(code) {
    const box = await fetch('pack.enc.json').then((r) => r.json());
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(box.salt), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(box.iv) }, key, b(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const MIN = { 'Reading': 55, 'Math': 57, 'Science': 60, 'English & Language Usage': 37 };
  function backLink(pack) {
    const back = document.createElement('p');
    back.innerHTML = '<a href="#" id="back">← Back to all tests</a>';
    root.parentNode.insertBefore(back, root);
    back.querySelector('#back').addEventListener('click', (e) => { e.preventDefault(); back.remove(); menu(pack); });
  }
  function runSection(pack, t, i, mode, chain, totals) {
    const s = pack[t].sections[i];
    const last = i === pack[t].sections.length - 1;
    const opts = { mode, minutes: mode === 'exam' ? MIN[s.name] : 0 };
    if (chain) {
      opts.nextLabel = last ? 'See my full test report' : 'Start next section: ' + pack[t].sections[i + 1].name;
      opts.onNext = (r) => {
        totals.push({ name: s.name, right: r.right, total: r.total });
        if (!last) runSection(pack, t, i + 1, mode, chain, totals);
        else report(totals);
      };
    }
    window.runQuiz(root, { section: s.name, passages: s.passages, questions: s.questions }, opts);
    window.scrollTo(0, 0);
  }
  function report(totals) {
    const R = totals.reduce((a, x) => a + x.right, 0), T = totals.reduce((a, x) => a + x.total, 0);
    let h = `<h1>Full practice test report</h1><div class="score-big">${Math.round(R / T * 100)}%</div><p>${R} of ${T} correct.</p><div class="bars">`;
    totals.forEach((x) => { const p = Math.round(x.right / x.total * 100); h += `<div class="bar"><div class="qmeta"><span>${x.name}</span><span>${x.right}/${x.total} (${p}%)</span></div><div class="track"><div class="fill ${p < 50 ? 'low' : p < 75 ? 'mid' : ''}" style="width:${p}%"></div></div></div>`; });
    h += '</div><p class="fine">Schools set their own TEAS score requirements. Check your program\'s minimum and focus your study on your lowest section first.</p>';
    root.innerHTML = h;
  }
  function menu(pack) {
    let h = '<h1>Your TEAS 7 Practice Pack</h1><p><strong>Exam mode</strong> works like test day: timed sections, no answers shown until the end, then a score by section and topic. <strong>Practice mode</strong> checks each answer as you go, with the explanation.</p>';
    for (const t of ['A', 'B']) {
      h += `<h2>Practice Test ${t}</h2><button class="btn wide" data-full="${t}">Take the full timed test (170 questions · 209 min)</button><p class="fine" style="margin:14px 0 4px">Or one section at a time:</p>`;
      pack[t].sections.forEach((s, i) => {
        h += `<div class="choice" style="cursor:default"><strong>${s.name}</strong> — ${s.questions.length} questions<br>
          <button class="btn small" data-t="${t}" data-i="${i}" data-m="exam">Exam mode · ${MIN[s.name]} min</button>
          <button class="btn small ghost" data-t="${t}" data-i="${i}" data-m="practice">Practice mode</button></div>`;
      });
    }
    h += '<h2>Printable PDF</h2><p>Both practice tests, the answer keys with explanations and the full study guide (about 160 pages).</p><button class="btn ghost" id="pdf">Download the PDF</button> <span class="fine" id="pdfmsg"></span>';
    root.innerHTML = h;
    document.getElementById('pdf').addEventListener('click', downloadPdf);
    root.querySelectorAll('[data-full]').forEach((b) => b.addEventListener('click', () => { backLink(pack); runSection(pack, b.dataset.full, 0, 'exam', true, []); }));
    root.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => { backLink(pack); runSection(pack, b.dataset.t, +b.dataset.i, b.dataset.m, false); }));
  }
  let CODE = '';
  async function downloadPdf() {
    const m = document.getElementById('pdfmsg'); m.textContent = 'Preparing your PDF…';
    try {
      const buf = new Uint8Array(await fetch('pack.pdf.enc').then((r) => r.arrayBuffer()));
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(CODE), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: buf.slice(0, 16), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([pt], { type: 'application/pdf' }));
      a.download = 'TEAS7-Practice-Pack-NurseEntryPrep.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      m.textContent = 'Done. Check your downloads.';
    } catch (e) { m.textContent = 'Download failed. Please try again or email support.'; }
  }
  async function go(code) {
    try {
      const pack = await open(code.trim());
      CODE = code.trim();
      try { localStorage.setItem('nep_code', code.trim()); } catch (e) {}
      menu(pack);
    } catch (e) {
      document.getElementById('msg').textContent = 'That code did not work. Check it and try again.';
    }
  }
  document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); go(document.getElementById('code').value); });
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('code');
  let saved = null; try { saved = localStorage.getItem('nep_code'); } catch (e) {}
  if (fromHash || saved) go(fromHash || saved);
})();
</script>
</body>
</html>
